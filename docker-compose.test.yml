version: '3.8'

services:
  test-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gymassistant-test-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Test_SqlServer_Pass123!
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Test_SqlServer_Pass123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Test_SqlServer_Pass123!' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - test-sql-data:/var/opt/mssql

volumes:
  test-sql-data:
